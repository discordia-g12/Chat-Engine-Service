version: '3.8'

services:
  chat-mongo:
    image: mongo:7.0
    container_name: chat-engine-mongo
    restart: unless-stopped
    ports:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-redis:
    image: redis:7-alpine
    container_name: chat-engine-redis
    restart: unless-stopped
    ports:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  chat-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-engine-service
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://chat-mongo:27017/chat_db
      - REDIS_URL=redis://chat-redis:6379
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    healthcheck:

      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo-data:
  redis-data: